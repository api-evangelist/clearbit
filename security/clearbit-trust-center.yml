description: >-
  Clearbit publishes a single-page trust center covering legal terms, data governance and privacy,
  compliance posture, security practices and a link to the status page. It documents a real
  compliance program — California data-broker registration, CCPA subjection, GDPR alignment, a
  subprocessor list, annual third-party penetration testing — but it does NOT claim any
  Clearbit-held security certification.
certifications: []
certifications_note: >-
  CORRECTION (2026-08-13). Earlier rounds of this artifact listed SOC 2, ISO 27001, PCI DSS and
  FedRAMP as Clearbit certifications. They are not. The single sentence on the trust page that
  contains those four strings attributes them to Clearbit's cloud vendors, not to Clearbit:
  "The AWS and GCP cloud infrastructure has been designed and managed in compliance with
  regulations, standards, and best practices, including SOC 2, ISO 27001, FedRAMP, GDPR, CCPA, and
  PCI DSS Level 1." The page links out to aws.amazon.com/compliance/programs/ and
  cloud.google.com/security/compliance as the evidence for that sentence. Keyword-matching the
  page credits Clearbit with an inherited posture it never claimed; the certifications list is
  therefore empty and the real, Clearbit-attributable program is recorded under compliance_program
  below.
