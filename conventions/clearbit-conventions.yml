  lifecycle: lifecycle/clearbit-lifecycle.yml
  authentication: authentication/clearbit-authentication.yml
  rate_limits: rate-limits/clearbit-rate-limits.yml
  webhooks: asyncapi/clearbit-webhooks.yml
