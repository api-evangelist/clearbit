last_entry: '2025-11-24'
cadence_note: >-
  Weekly through mid-2024, then sparse. The four most recent entries (2025-02-13, 2025-06-10,
  2025-10-22, 2025-11-24) are all deprecation announcements; each carries "No significant bug
  fixes to note".
entries:
- date: '2025-11-24'
  title: 'December 8: Clearbit Logo API Sunset'
  type: deprecation
  breaking: true
  effective: '2025-12-08'
  highlights:
  - After 2025-12-08 the public Logo API URL (logo.clearbit.com) is no longer available.
  - >-
      Directs remaining users to audit integrations and contact their CSM or support@clearbit.com
      for alternative logo access.
- date: '2025-10-22'
  title: 'Nov 12: Planned 24-Hour Outage of Logo API (logo.clearbit.com)'
  type: deprecation
  breaking: true
  effective: '2025-11-12'
  highlights:
  - >-
      A deliberate 24-hour outage on 2025-11-12, described as "intentional and designed to help
      users still relying on the service take notice".
- date: '2025-06-10'
  title: Clearbit Logo API Will Be Sunset on December 1, 2025
  type: deprecation
  breaking: true
  effective: '2025-12-01'
  highlights:
  - Affects all users, including those with active subscriptions.
  - From 2025-09-09 the logo field in the Autocomplete API returns null.
  - >-
      Alternatives named: the Company Enrichment API logo attribute, and the Name to Domain API
      logo field.
- date: '2025-02-13'
  title: Clearbit's free tools will be discontinued on April 30, 2025
  type: deprecation
  breaking: true
  effective: '2025-04-30'
  highlights:
  - >-
      Free Clearbit Platform, Weekly Visitor Report, Clearbit Connect, TAM Calculator and the free
      Slack integration all discontinued.
  - Logo API sunset first announced here, for 2025-12-01.
  - Points users to HubSpot Breeze Intelligence, and to Logo.dev for logos.
- date: '2024-08-27'
  title: Changes, improvements, and bug fixes
  type: improvement
  breaking: false
  highlights:
  - >-
      Audience results no longer limited to Salesforce accounts and HubSpot companies with fewer
      than 50 contacts.
  - HubSpot Enrichment now processes Tech Tag and Company Tag picklists.
- date: '2024-03-19'
  title: Clearbit by HubSpot
  type: feature
  breaking: false
  highlights:
  - >-
      Launch of the HubSpot-centric Clearbit experience combining Enrichment, Forms, Target
      Markets and Visitors.
  - Free accounts get Target Markets, Visitors, Lookup and HubSpot CRM sync.
  - Paid accounts additionally get Enrichment and Forms.
- date: '2024-04-09'
  title: Changes, improvements, and bug fixes
  type: improvement
  breaking: false
  highlights:
  - >-
      Community Data Opt Out added to Admin Account Settings, letting customers prevent submitted
      email addresses from entering the Clearbit database.
  - Restricted picklists now push only matching values instead of dropping the whole field.
- date: '2024-04-16'
  title: Changes, improvements, and bug fixes
  type: improvement
  breaking: false
  highlights:
  - List Enrichment now limits enriching the same list to three times within an hour.
- date: '2024-01-30'
  title: Changes, improvements, and bug fixes
  type: fix
  breaking: false
  highlights:
  - Improved accuracy of NAICS industry values in Company records.
  - Addressed increased response times in the Reveal API.
