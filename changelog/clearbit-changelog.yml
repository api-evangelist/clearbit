description: >-
  Clearbit maintains two separate dated logs. "Clearbit release notes" at clearbit.com/changelog is
  the product log — server-rendered, dated, and the channel through which every sunset was
  announced. The API version change log in the help centre is the contract log, listing each dated
  API version and the field-level change it introduced. The product log has gone quiet on features:
  after August 2024 every entry is a retirement notice.
