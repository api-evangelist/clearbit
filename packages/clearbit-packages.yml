description: >-
  Clearbit published first-party client libraries for Node.js, Ruby, Python and Go. Every one of
  them was last released BEFORE HubSpot acquired Clearbit (announced 2023-11-01, closed December
  2023) — the newest is the Go module at 2021-11-12 and the oldest is the Python package at
  2017-10-24. The repositories are public and unarchived, but no client library has shipped a
  release in the HubSpot era, which is the clearest provider-published decay signal available for
  this provider.
