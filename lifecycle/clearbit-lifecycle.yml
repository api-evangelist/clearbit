provider: Clearbit (HubSpot Breeze Intelligence)
providerId: clearbit
description: >-
  Clearbit runs a Stripe-style dated version model: your account's API version is pinned the first
  time you call, every backwards-incompatible change ships as a new dated version, and the version
  in force is echoed on every response in the x-api-version header. The provider is in active,
  publicly dated wind-down — the free tools were sunset 2025-04-30, the free Logo API was sunset
  2025-12-08, and new API keys have not been issued since 2023.
versioning:
  scheme: dated-account-version
  signal: response-header
  response_header: x-api-version
  request_override: >-
    A specific version can be requested per call by setting the version header on the request; the
    account-wide default is changed from the dashboard API section.
  pinning: >-
    "Your version gets set the first time you make an API request. When we change any of our APIs
    in a backwards-incompatible way, we release a new dated version, but to avoid breaking your
    code, we don't change your version until you're ready to upgrade."
