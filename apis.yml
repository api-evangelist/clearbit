- aid: clearbit:logo
  name: Clearbit Logo API (retired)
  description: 'RETIRED 2025-12-08. The free Logo API returned a company logo image for a domain
    with no authentication. Announced 2025-02-13, moved to 2025-12-01, then final on 2025-12-08
    after a deliberate 24-hour warning outage on 2025-11-12. Verified 2026-08-13: logo.clearbit.com
    no longer resolves (NXDOMAIN) — callers get a DNS failure, not a documented 410. Logos remain
    available to paying customers via the Company Enrichment API logo attribute; Clearbit
    recommends Logo.dev as the public alternative.'
  humanURL: https://clearbit.com/logo
  baseURL: https://logo.clearbit.com
