x-pointers-deliberately-absent:
  note: >-
    Recorded so a later round does not "fix" these by adding a pointer the provider has not
    earned. Each was probed on 2026-08-13 and missed.
  MCPServer: >-
    No first-party MCP server. mcp/clearbit-mcp.yml is a derived candidate with deployment.mode
    none. The Zapier / viaSocket / Apify Clearbit MCP listings are third-party wrappers.
  AgentCard: >-
    /.well-known/agent-card.json and /.well-known/agent.json returned 404 on all eight hosts.
  WellKnown: >-
    44 well-known paths probed across 8 hosts, zero hits. well-known/clearbit-well-known.yml
    records the absence.
  SecurityTxt: /.well-known/security.txt 404 on every host.
  Idempotency: >-
    No idempotency key, replay semantics or retention window is documented anywhere. Conventions
    records the absence explicitly.
  AgentSkill: >-
    No OpenAPI exists to ground real operationIds in, so no skill can be written without
    inventing operation identifiers.
  OpenAPI: >-
    No spec at any probed location on any host. See x-coverage.
  AsyncAPI: >-
    /asyncapi.yaml and /asyncapi.json 404 on every host. Two webhook surfaces are documented in
    prose only and carry the Webhooks pointer instead.
  GraphQL: >-
    REMOVED this round. The prior pointer at graphql/clearbit-graphql.md asserted a GraphQL API;
    that file is an API Evangelist conceptual translation of the REST surface, not a provider
    endpoint. A real but undocumented, fully auth-gated GraphQL endpoint was found behind the
    dashboard at https://app.clearbit.com/graphql and is recorded in
    graphql/clearbit-graphql-endpoint-probe.yml — it is not a published product and is not wired.
  Sandbox: No sandbox, test mode or test credentials are published.
  CLI: No first-party CLI in the github.com/clearbit organization or the docs.
  Postman: No first-party Clearbit-owned public Postman workspace or collection found.
  Roadmap: No public roadmap.
  SignUp: >-
    Login is wired instead. Sign-up for API access is closed — no new API keys since 2023 and free
    accounts sunset 2025-04-30.
