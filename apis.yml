- aid: clearbit:name-to-domain
  name: Clearbit Autocomplete API
  description: 'Free, unauthenticated company autocomplete: returns candidate companies (name,
    domain, logo) for a name fragment. Endpoint /v1/companies/suggest?query=. The only Clearbit
    endpoint that answers an anonymous caller — verified live 2026-08-13, HTTP 200, CORS-enabled,
    CloudFront-cached. The logo field has returned null since 2025-09-09 ahead of the Logo API
    sunset. The separate authenticated Name to Domain endpoint lives on company.clearbit.com.'
  humanURL: https://help.clearbit.com/hc/en-us/articles/8502992633111-Autocomplete-Name-to-Domain-and-Risk-API-FAQ
