aid: clearbit
url: https://raw.githubusercontent.com/api-evangelist/clearbit/refs/heads/main/apis.yml
name: Clearbit (HubSpot Breeze Intelligence)
kind: company
description: >-
  Clearbit is a B2B marketing and sales intelligence platform whose REST APIs resolve an email
  address to a person, a domain to a company, and an IP address to the business behind it,
  returning firmographic, technographic and persona data across a documented 100+ company and 60+
  person attributes classified against GICS, SIC and NAICS. HubSpot acquired Clearbit in December
  2023 and sells the capability as HubSpot Breeze Intelligence. The legacy Clearbit APIs
  (Enrichment, Streaming, Reveal, Prospector, Discovery, Risk, Name-to-Domain, Autocomplete)
  remain live and answer on their production hosts, but the provider is in publicly dated
  wind-down — new API keys have not been issued since 2023, free accounts were sunset 2025-04-30,
  and the free Logo API was sunset 2025-12-08 and its host no longer resolves. Only the free
  Autocomplete API is callable without a credential.
accessModel:
  pricing: free
  onboarding: closed
  trial: false
  try_now: true
  public: false
  label: Free
  confidence: high
  source:
  - plans
  - probe
  generated: '2026-08-13'
  method: probed
  note: >-
    try_now is true only because the Autocomplete API answers anonymously (HTTP 200 verified
    2026-08-13). onboarding is closed — Clearbit does not issue API keys to accounts created
    after 2023.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/clearbit.png
tags:
- Sales Intelligence
- B2B
- Enrichment
- Reveal
- HubSpot
- Marketing
- Data
- Firmographics
- Lead Enrichment
- Company Data
